name: Update model-making manifest

on:
  push:
    branches: [main]
    paths:
      - 'images/model-making/**'

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate manifest
        run: |
          python3 -c "
          import os, json
          folder = 'images/model-making'
          exts = {'.jpg','.jpeg','.png','.webp','.gif','.mp4','.mov','.webm'}
          files = sorted([f for f in os.listdir(folder)
                          if os.path.splitext(f.lower())[1] in exts and f != 'manifest.json'])
          with open(os.path.join(folder,'manifest.json'),'w') as f:
              json.dump(files, f, indent=2)
          print(f'Manifest updated: {len(files)} images')
          "
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/model-making/manifest.json
          git diff --staged --quiet || git commit -m "Auto-update model-making manifest [skip ci]"
          git push
