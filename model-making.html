<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Model Making & Earlier Work — Amran Ali</title>
  <link rel="icon" type="image/png" href="images/icons/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet"/>
  <style>
:root {
  --bg:         #EDE8DF;
  --surface:    #F5F2EC;
  --offwhite:   #FAFAF7;
  --text:       #252525;
  --text-muted: rgba(37,37,37,0.55);
  --a1:         #17405f;
  --a1-dk:      #0d2a3e;
  --a1-lt:      #e8f0f6;
  --a2:         #17e3c7;
  --border:     rgba(37,37,37,0.14);
  --shadow:     #252525;
  --shadow-sm:  4px 4px 0px;
  --shadow-md:  6px 6px 0px;
  --shadow-lg:  8px 8px 0px;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --serif: 'Playfair Display', Georgia, serif;
  --sans:  -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --ease:  cubic-bezier(0.22,1,0.36,1);
}
[data-theme="dark"] {
  --bg:         #0d1b26;
  --surface:    #152232;
  --offwhite:   #1c2f40;
  --text:       #EDE8DF;
  --text-muted: rgba(237,232,223,0.55);
  --a1:         #17e3c7;
  --a1-dk:      #0fb5a0;
  --a1-lt:      rgba(23,227,199,0.1);
  --a2:         #4ea8d4;
  --border:     rgba(237,232,223,0.12);
  --shadow:     rgba(0,0,0,0.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
h1{font-family:var(--serif);font-size:clamp(44px,8vw,72px);font-weight:900;line-height:1.05;letter-spacing:-.02em}
.a1{color:var(--a1)}
.container{max-width:1160px;margin:0 auto;padding:0 24px}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;z-index:200;padding:18px 0;transition:background .25s var(--ease),border-color .25s var(--ease),padding .25s var(--ease);border-bottom:1px solid transparent}
#nav.scrolled{background:var(--bg);border-color:var(--border);padding:12px 0}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:24px}
.nav-logo{font-family:var(--serif);font-size:21px;font-weight:900;color:var(--a1);cursor:pointer;user-select:none;line-height:1}
.nav-right{display:flex;align-items:center;gap:16px}
.back-btn{font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;transition:color .2s;letter-spacing:.01em}
.back-btn:hover{color:var(--a1)}
.theme-toggle{background:none;border:2px solid var(--border);border-radius:50%;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:border-color .2s,color .2s}
.theme-toggle:hover{border-color:var(--a1);color:var(--a1)}
.theme-toggle svg{width:16px;height:16px}

/* HERO */
.mm-hero{padding:140px 0 56px}
.mm-eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--a1);margin-bottom:16px}
.mm-title{margin-bottom:28px}
.mm-blurb-wrap{position:relative;max-width:680px}
#mm-blurb{font-size:18px;line-height:1.7;color:var(--text-muted)}
.edit-btn{position:absolute;top:0;right:-36px;background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;border-radius:6px;transition:color .2s,background .2s;display:none}
.edit-btn:hover{color:var(--a1);background:var(--a1-lt)}
.edit-btn svg{width:16px;height:16px}
.has-token .edit-btn{display:flex}

/* EDIT PANEL */
#edit-panel{display:none;margin-top:16px;background:var(--surface);border:2px solid var(--border);border-radius:var(--r-md);padding:20px;max-width:680px}
#edit-panel.open{display:block}
#edit-textarea{width:100%;min-height:120px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r-sm);padding:12px;font-size:16px;line-height:1.65;color:var(--text);font-family:var(--sans);resize:vertical;outline:none}
#edit-textarea:focus{border-color:var(--a1)}
.edit-actions{display:flex;gap:10px;margin-top:12px;align-items:center}
.btn-publish{background:var(--a1);color:#fff;border:none;border-radius:var(--r-sm);padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
.btn-publish:hover{background:var(--a1-dk)}
.btn-cancel{background:none;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text);transition:border-color .2s}
.btn-cancel:hover{border-color:var(--a1)}
#edit-status{font-size:13px;color:var(--text-muted)}

/* GALLERY */
.mm-gallery{padding:0 0 96px}
.masonry{columns:3;column-gap:12px}
.masonry-item{break-inside:avoid;margin-bottom:12px;border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.masonry-item img{width:100%;display:block;transition:transform .3s var(--ease)}
.masonry-item:hover img{transform:scale(1.02)}
.gallery-loading{text-align:center;padding:60px 0;color:var(--text-muted)}
.gallery-empty{text-align:center;padding:60px 0;color:var(--text-muted)}

/* LIGHTBOX */
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:500;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:var(--r-sm)}
#lb-close{position:absolute;top:20px;right:20px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;line-height:1}
#lb-prev,#lb-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:none;color:#fff;font-size:24px;width:48px;height:48px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
#lb-prev{left:16px}
#lb-next{right:16px}
#lb-prev:hover,#lb-next:hover{background:rgba(255,255,255,.25)}

@media(max-width:900px){.masonry{columns:2}}
@media(max-width:560px){.masonry{columns:1}.mm-hero{padding:120px 0 40px}}
  </style>
</head>
<body>

<nav id="nav">
  <div class="container nav-inner">
    <a class="nav-logo" href="index.html">AA<span class="a1">.</span></a>
    <div class="nav-right">
      <a class="back-btn" href="index.html">← Portfolio</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <svg id="theme-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M17.5 12.5A7.5 7.5 0 1 1 7.5 2.5a5.5 5.5 0 0 0 10 10z"/>
        </svg>
      </button>
    </div>
  </div>
</nav>

<section class="mm-hero">
  <div class="container">
    <div class="mm-eyebrow">Earlier Work</div>
    <h1 class="mm-title">Model Making<br><span class="a1">&</span> Earlier Work</h1>
    <div class="mm-blurb-wrap" id="blurb-wrap">
<!-- MM-CONTENT-START -->
<p id="mm-blurb">Physical prototypes, furniture models and product design projects from Kingston University and my early career. Craft-led work exploring materials, form and manufacturing.</p>
<!-- MM-CONTENT-END -->
      <button class="edit-btn" id="edit-btn" title="Edit blurb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
    </div>
    <div id="edit-panel">
      <textarea id="edit-textarea" placeholder="Describe your model making work…"></textarea>
      <div class="edit-actions">
        <button class="btn-publish" id="btn-publish">Publish</button>
        <button class="btn-cancel" id="btn-cancel">Cancel</button>
        <span id="edit-status"></span>
      </div>
    </div>
  </div>
</section>

<section class="mm-gallery">
  <div class="container">
    <div class="masonry" id="gallery">
      <div class="gallery-loading">Loading gallery…</div>
    </div>
  </div>
</section>

<!-- Lightbox -->
<div id="lightbox" role="dialog" aria-label="Image viewer">
  <button id="lb-close" aria-label="Close">×</button>
  <button id="lb-prev" aria-label="Previous">‹</button>
  <img id="lb-img" src="" alt=""/>
  <button id="lb-next" aria-label="Next">›</button>
</div>

<script>
const GH_REPO = 'amranaali-creator/AmranAliPortfolio';
const GH_BRANCH = 'main';
const GH_FILE = 'model-making.html';

/* ── Theme ── */
(function(){
  const saved = localStorage.getItem('aa-theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  const btn = document.getElementById('theme-toggle');
  const icon = document.getElementById('theme-icon');
  function setIcon(dark){
    icon.innerHTML = dark
      ? '<circle cx="10" cy="10" r="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="10" y1="16" x2="10" y2="18"/><line x1="2" y1="10" x2="4" y2="10"/><line x1="16" y1="10" x2="18" y2="10"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="14.4" y1="14.4" x2="15.8" y2="15.8"/><line x1="4.2" y1="15.8" x2="5.6" y2="14.4"/><line x1="14.4" y1="5.6" x2="15.8" y2="4.2"/>'
      : '<path d="M17.5 12.5A7.5 7.5 0 1 1 7.5 2.5a5.5 5.5 0 0 0 10 10z"/>';
  }
  function sync(){
    const dark = document.documentElement.getAttribute('data-theme')==='dark';
    setIcon(dark);
  }
  sync();
  btn.addEventListener('click',()=>{
    const dark = document.documentElement.getAttribute('data-theme')==='dark';
    const next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('aa-theme', next);
    sync();
  });
})();

/* ── Nav scroll ── */
window.addEventListener('scroll',()=>{
  document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 10);
},{passive:true});

/* ── CMS token check ── */
(function(){
  if(localStorage.getItem('aa-gh-token')){
    document.getElementById('blurb-wrap').classList.add('has-token');
  }
})();

/* ── Edit blurb ── */
const editBtn = document.getElementById('edit-btn');
const editPanel = document.getElementById('edit-panel');
const textarea = document.getElementById('edit-textarea');
const btnPublish = document.getElementById('btn-publish');
const btnCancel = document.getElementById('btn-cancel');
const statusEl = document.getElementById('edit-status');

editBtn.addEventListener('click',()=>{
  textarea.value = document.getElementById('mm-blurb').textContent.trim();
  editPanel.classList.add('open');
  textarea.focus();
});
btnCancel.addEventListener('click',()=>{ editPanel.classList.remove('open'); statusEl.textContent=''; });

btnPublish.addEventListener('click', async ()=>{
  const newText = textarea.value.trim();
  if(!newText){ statusEl.textContent='Please enter some text.'; return; }
  const token = localStorage.getItem('aa-gh-token');
  if(!token){ statusEl.textContent='No GitHub token set.'; return; }
  statusEl.textContent='Publishing…';
  btnPublish.disabled = true;
  try {
    const metaRes = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}`,{
      headers:{Authorization:`token ${token}`,Accept:'application/vnd.github+json'}
    });
    if(!metaRes.ok) throw new Error(`API ${metaRes.status}`);
    const meta = await metaRes.json();
    const sha = meta.sha;
    const bytes = Uint8Array.from(atob(meta.content.replace(/\n/g,'')), c=>c.charCodeAt(0));
    const rawHtml = new TextDecoder().decode(bytes);
    let found = false;
    const newPara = `<p id="mm-blurb">${newText.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>`;
    const updated = rawHtml.replace(
      /(<!-- MM-CONTENT-START -->\n)([\s\S]*?)(\n<!-- MM-CONTENT-END -->)/,
      (_,open,_old,close)=>{ found=true; return open+newPara+close; }
    );
    if(!found) throw new Error('Content markers not found in file.');
    const encoder = new TextEncoder();
    const encoded = encoder.encode(updated);
    let b64=''; const chunk=8192;
    for(let i=0;i<encoded.length;i+=chunk){
      b64+=btoa(String.fromCharCode(...encoded.subarray(i,i+chunk)));
    }
    const putRes = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`,{
      method:'PUT',
      headers:{Authorization:`token ${token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify({message:'Update model-making blurb via CMS',content:b64,sha,branch:GH_BRANCH})
    });
    if(!putRes.ok){ const e=await putRes.json().catch(()=>({})); throw new Error(e.message||putRes.status); }
    document.getElementById('mm-blurb').textContent = newText;
    statusEl.textContent='✓ Published';
    editPanel.classList.remove('open');
  } catch(e){
    statusEl.textContent='Error: '+e.message;
  } finally {
    btnPublish.disabled=false;
  }
});

/* ── Gallery ── */
let images = [];
let currentIdx = 0;

async function loadGallery(){
  const gallery = document.getElementById('gallery');
  try {
    const res = await fetch('images/model-making/manifest.json?_='+Date.now());
    if(!res.ok) throw new Error('manifest not found');
    images = await res.json();
    if(!images.length){ gallery.innerHTML='<div class="gallery-empty">No images yet.</div>'; return; }
    gallery.innerHTML = images.map((f,i)=>
      `<div class="masonry-item" data-idx="${i}">
        <img src="images/model-making/${encodeURIComponent(f)}" alt="${f}" loading="lazy">
      </div>`
    ).join('');
    gallery.querySelectorAll('.masonry-item').forEach(item=>{
      item.addEventListener('click',()=> openLightbox(+item.dataset.idx));
    });
  } catch(e){
    gallery.innerHTML='<div class="gallery-empty">Gallery unavailable.</div>';
  }
}

/* ── Lightbox ── */
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');

function openLightbox(idx){
  currentIdx = idx;
  lbImg.src = `images/model-making/${encodeURIComponent(images[idx])}`;
  lbImg.alt = images[idx];
  lb.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLightbox(){ lb.classList.remove('open'); document.body.style.overflow=''; }
function prevImage(){ openLightbox((currentIdx-1+images.length)%images.length); }
function nextImage(){ openLightbox((currentIdx+1)%images.length); }

document.getElementById('lb-close').addEventListener('click',closeLightbox);
lb.addEventListener('click',e=>{ if(e.target===lb) closeLightbox(); });
document.getElementById('lb-prev').addEventListener('click',e=>{ e.stopPropagation(); prevImage(); });
document.getElementById('lb-next').addEventListener('click',e=>{ e.stopPropagation(); nextImage(); });
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open')) return;
  if(e.key==='Escape') closeLightbox();
  if(e.key==='ArrowLeft') prevImage();
  if(e.key==='ArrowRight') nextImage();
});

loadGallery();
</script>
</body>
</html>
